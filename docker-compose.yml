# Used on the Oracle VM only (see oracle-cloud-deployment-guide.md). Wraps the
# `docker build` + `docker stop/rm/run` sequence from the guide into one
# idempotent command (`docker compose up -d --build`), which is what the
# deploy.yml GitHub Actions workflow runs on every push.
services:
  reelforge:
    build: .
    container_name: reelforge
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    volumes:
      # Bind-mounted host paths, matching `mkdir -p ~/reelforge-data/...` from
      # the deployment guide -- generated videos and job history survive
      # container rebuilds/restarts.
      - /home/ubuntu/reelforge-data/workdir:/app/workdir
      - /home/ubuntu/reelforge-data/db:/app/data
